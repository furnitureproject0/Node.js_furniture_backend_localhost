version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: furniture-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myapp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: furniture-app
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - db
    command: >
      sh -c "
      apk add --no-cache curl netcat-openbsd &&
      until nc -z db 3306; do echo Waiting for DB; sleep 2; done &&
      node src/app.js
      "
    # command: npx nodemon src/app.js

volumes:
  db_data:
