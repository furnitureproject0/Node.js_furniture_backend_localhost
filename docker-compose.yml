services:
  app:
    build: .
    container_name: furniture-app
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads   
      - ./:/app                 
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_USER=furniture_user
      - DB_PASSWORD=furniture_pass
      - DB_NAME=furniture_db
    depends_on:
      - db
    command: >
      sh -c "apk add --no-cache curl && 
              until nc -z db 3306; do echo Waiting for DB; sleep 2; done &&
              node src/app.js"

  db:
    image: mysql:8.0
    container_name: furniture-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myapp
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
